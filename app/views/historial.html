<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 - Historial</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- CSS Global + Componentes -->
    <link rel="stylesheet" href="../../public/css/global.css">
    <link rel="stylesheet" href="../../public/css/components/sidebar.css?v=3">
    <link rel="stylesheet" href="../../public/css/components/transactionList.css">
    <link rel="stylesheet" href="../../public/css/styleDashboard.css?v=2">
    <link rel="stylesheet" href="../../public/css/styleHistorial.css?v=3">
    <link rel="shortcut icon" href="../../public/img/Logo.png" type="image/x-icon">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Componente: Sidebar -->
        <div id="sidebar-container"></div>

        <main class="main-content" id="main-content">
            <!-- Componente: Top Header -->
            <div id="header-container"></div>

            <div class="historial-container">
                <div class="historial-header">
                    <h2>Historial de Movimientos</h2>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="todos">Todas</button>
                        <button class="filter-btn" data-filter="entrada">Solo entradas</button>
                        <button class="filter-btn" data-filter="salida">Solo salidas</button>
                    </div>
                </div>

                <!-- Reutilizamos el transactionList del dashboard pero lo llenamos dinámicamente -->
                <div id="historial-list-container"></div>
            </div>
        </main>
    </div>

    <!-- Modal de detalle -->
    <div class="modal-overlay" id="transaction-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-modal"><i class="fas fa-times"></i></button>
            <div class="modal-body">
                <i class="modal-icon fas fa-exchange-alt" id="modal-icon"></i>
                <div class="modal-amount" id="modal-amount">0,00</div>
                <div class="modal-title" id="modal-title">Título</div>
                <div class="modal-details">
                    <p>Fecha: <span id="modal-date">--</span></p>
                    <p>Tipo: <span id="modal-type">--</span></p>
                    <p>Referencia: <span id="modal-ref">--</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Componentes JS -->
    <script src="../views/components/sidebar.js?v=3"></script>
    <script src="../views/components/topHeader.js"></script>
    <script src="../views/components/transactionList.js"></script>

    <!-- Inicializar componentes -->
    <script>
        renderSidebar('sidebar-container', { 
            activePage: 'movimientos',
            logoSrc: '../../public/img/Logo.png'
        });
        
        // Obtener nombre del usuario de localStorage
        const user = JSON.parse(localStorage.getItem('usuarioLogueado')) || { nombre: 'Usuario' };
        renderTopHeader('header-container', { userName: user.nombre });
    </script>

    <!-- Controllers -->
    <script src="../controllers/theme.js"></script>
    <script src="../controllers/historial.js"></script>
    <script src="../controllers/salir.js"></script>
</body>
</html>
