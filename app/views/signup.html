<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 - Registro</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Global + Componentes -->
    <link rel="stylesheet" href="../../public/css/global.css">
    <link rel="stylesheet" href="../../public/css/components/authImageSection.css">
    <link rel="stylesheet" href="../../public/css/components/authForm.css">
    <link rel="stylesheet" href="../../public/css/components/errorModal.css">
    <link rel="stylesheet" href="../../public/css/styleSignup.css">
    <link rel="shortcut icon" href="../../public/img/Logo.png" type="image/x-icon">
</head>
<body>
    <main class="login-layout">
        <!-- Componente: Sección de imagen -->
        <div id="auth-image-container"></div>

        <div class="login-form-section">
            <div class="boxLogin">
                <div class="boxLogin-header">
                    <img src="../../public/img/logo_vertical.png" alt="Banca 360 Logo" class="logo">
                     <h1>Crea tu cuenta</h1>
                     <p>Únete a Banca 360 y gestiona tu futuro hoy.</p>
                </div>
                <div class="boxLogin-body">
                    <form action="" id="registroForm">
                        <div class="input-row">
                            <div class="input-group">
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre" placeholder="Ej. Juan" required>
                            </div>
                            <div class="input-group">
                                <label for="apellido">Apellido</label>
                                <input type="text" id="apellido" placeholder="Ej. Pérez" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label for="cedula">Cédula</label>
                                <input type="text" id="cedula" placeholder="V-00000000" required>
                            </div>
                            <div class="input-group">
                                <label for="telefono">Teléfono</label>
                                <input type="tel" id="telefono" placeholder="0412-0000000" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="direccion">Dirección de Habitación</label>
                            <input type="text" id="direccion" placeholder="Av. Principal, Edificio..." required>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                                <input type="date" id="fecha_nacimiento" required>
                            </div>
                            <div class="input-group">
                                <label for="genero">Género</label>
                                <select id="genero" required>
                                    <option value="" disabled selected>Selecciona</option>
                                    <option value="masculino">Masculino</option>
                                    <option value="femenino">Femenino</option>
                                    <option value="otro">Otro</option>
                                </select>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="pregunta">Pregunta de Seguridad</label>
                            <select id="pregunta" required style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border-color); border-radius: 8px; background-color: var(--bg-input); color: var(--text-main);">
                                <option value="" disabled selected>Selecciona una pregunta</option>
                                <option value="¿Cuál es el nombre de tu primera mascota?">¿Cuál es el nombre de tu primera mascota?</option>
                                <option value="¿Cuál es tu color favorito?">¿Cuál es tu color favorito?</option>
                                <option value="¿En qué ciudad naciste?">¿En qué ciudad naciste?</option>
                            </select>
                        </div>
                        <div class="input-group" style="margin-top: 0.5rem;">
                            <input type="text" id="respuesta" placeholder="Tu respuesta" required>
                        </div>

                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <div class="input-with-icon" style="position: relative;">
                                <input type="password" id="password" placeholder="Crea una clave segura" required style="padding-right: 40px; width: 100%;">
                                <i class="fas fa-eye toggle-password" data-target="password" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8;"></i>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="confirm-password">Confirmar Contraseña</label>
                            <div class="input-with-icon" style="position: relative;">
                                <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required style="padding-right: 40px; width: 100%;">
                                <i class="fas fa-eye toggle-password" data-target="confirm-password" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8;"></i>
                            </div>
                        </div>

                        <button type="submit">Crear Cuenta</button>

                        <div class="footer-link">
                            <p>¿Ya tienes cuenta? <a href="../../index.html">Inicia sesión aquí</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Componente: Modal de error -->
    <div id="modal-container"></div>

    <!-- Componente JS -->
    <script src="../views/components/authImageSection.js"></script>
    <script src="../views/components/errorModal.js"></script>

    <!-- Inicializar componente -->
    <script>
        renderAuthImageSection('auth-image-container', { 
            imageSrc: '../../public/img/login.png',
            altText: 'Registro Background'
        });
        renderErrorModal('modal-container');
    </script>

    <!-- Controller -->
    <script src="../controllers/registro.js"></script>
</body>
</html>
