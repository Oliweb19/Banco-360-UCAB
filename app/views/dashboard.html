<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 - Dashboard</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- CSS Global + Componentes -->
    <link rel="stylesheet" href="../../public/css/global.css">
    <link rel="stylesheet" href="../../public/css/components/sidebar.css">
    <link rel="stylesheet" href="../../public/css/components/balanceCard.css">
    <link rel="stylesheet" href="../../public/css/components/quickActions.css">
    <link rel="stylesheet" href="../../public/css/components/transactionList.css">
    <link rel="stylesheet" href="../../public/css/styleDashboard.css">
    <link rel="shortcut icon" href="../../public/img/Logo.png" type="image/x-icon">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Componente: Sidebar -->
        <div id="sidebar-container"></div>

        <main class="main-content">
            <!-- Componente: Top Header -->
            <div id="header-container"></div>

            <div class="dashboard-grid">
                <!-- Componente: Balance Card -->
                <div id="balance-container"></div>

                <!-- Componente: Quick Actions -->
                <div id="actions-container"></div>

                <!-- Componente: Transaction List -->
                <div id="transactions-container"></div>
            </div>
        </main>
    </div>

    <!-- Componentes JS -->
    <script src="../views/components/sidebar.js"></script>
    <script src="../views/components/topHeader.js"></script>
    <script src="../views/components/balanceCard.js"></script>
    <script src="../views/components/quickActions.js"></script>
    <script src="../views/components/transactionList.js"></script>

    <!-- Inicializar componentes -->
    <script>
        renderSidebar('sidebar-container', { 
            activePage: 'resumen',
            logoSrc: '../../public/img/Logo.png'
        });
        renderTopHeader('header-container', { userName: 'Oliver' });
        renderBalanceCard('balance-container', { balance: '11.000.450,00' });
        renderQuickActions('actions-container');
        renderTransactionList('transactions-container');
    </script>

    <!-- Controllers (después de renderizar componentes) -->
    <script src="../controllers/theme.js"></script>
    <script src="../controllers/salir.js"></script>
</body>
</html>
